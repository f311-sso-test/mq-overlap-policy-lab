name: MQ overlap writer check
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to apply to both refs
        required: true
permissions:
  contents: write
jobs:
  update-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Apply identical direct ref updates
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set +e
          for branch in mq-overlap-control mq-overlap-target; do
            response="$(curl -sS -w '\nHTTP_STATUS:%{http_code}\nREQUEST_ID:%header{x-github-request-id}\n' \
              -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" \
              --data "{\"sha\":\"${TARGET_SHA}\",\"force\":false}")"
            printf 'BRANCH:%s\n%s\n' "$branch" "$response"
          done
